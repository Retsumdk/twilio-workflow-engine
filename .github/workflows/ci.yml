name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest -q
      - name: Demo snapshot
        run: twe demo | diff - demo-expected.txt

  pip-install-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install from GitHub
        run: |
          cd /tmp
          pip install git+https://github.com/${{ github.repository }}.git
          python -c "import twilio_workflow; print('PIP_INSTALL_OK', len(twilio_workflow.__all__), 'exports')"
