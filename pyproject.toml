[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twilio-workflow-engine"
version = "0.1.0"
description = "twilio workflow engine implementation"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
